name: Refresh Fyers Token

on:
  schedule:
    - cron: '30 2 * * 1-5'  # Roz 8 AM IST (2:30 AM UTC) Monday-Friday
  workflow_dispatch:  # Manual trigger bhi

jobs:
  refresh-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install fyers-apiv3 requests pyotp

      - name: Refresh Token
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_KEY: ${{ secrets.FYERS_SECRET_KEY }}
          FYERS_TOTP_KEY: ${{ secrets.FYERS_TOTP_KEY }}
          FYERS_PIN: ${{ secrets.FYERS_PIN }}
          FYERS_CLIENT_ID: ${{ secrets.FYERS_CLIENT_ID }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: python scripts/auto_refresh.py
